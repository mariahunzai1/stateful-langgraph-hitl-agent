version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: langgraph-hitl-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      - LLM_API_KEY=${LLM_API_KEY:-ollama}
      - LLM_MODEL=${LLM_MODEL:-llama3.2:3b}
      - BUSINESS_DB_PATH=/app/data/ops_data.sqlite
      - CHECKPOINT_DB_PATH=/app/data/agent_checkpoints.sqlite
      - AUTO_SEED_DEMO_DATA=true
      - MAX_AUTO_REFUND_LIMIT=0.0
    volumes:
      - ops_data_volume:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: langgraph-hitl-ui
    command: streamlit run ui/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      - LLM_API_KEY=${LLM_API_KEY:-ollama}
      - LLM_MODEL=${LLM_MODEL:-llama3.2:3b}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ops_data_volume:
    name: langgraph_hitl_data
